[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NEXT_PUBLIC_SITE_URL = "https://beehivewebdesigns.com"

[[redirects]]
  from = "/locations"
  to = "/"
  status = 301

[[redirects]]
  from = "/locations/*"
  to = "/"
  status = 301

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
